name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    if: >-
      vars.MIRROR_SOURCE_REPOSITORY != '' &&
      github.repository == vars.MIRROR_SOURCE_REPOSITORY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked --all-groups

      - run: uv run ruff check --output-format=github .

  format:
    name: Format (ruff format --check)
    runs-on: ubuntu-latest
    if: >-
      vars.MIRROR_SOURCE_REPOSITORY != '' &&
      github.repository == vars.MIRROR_SOURCE_REPOSITORY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked --all-groups

      - run: uv run ruff format --check .

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    if: >-
      vars.MIRROR_SOURCE_REPOSITORY != '' &&
      github.repository == vars.MIRROR_SOURCE_REPOSITORY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked --all-groups

      - run: uv run ty check

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    if: >-
      vars.MIRROR_SOURCE_REPOSITORY != '' &&
      github.repository == vars.MIRROR_SOURCE_REPOSITORY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked --all-groups

      - run: uv run pytest -v
