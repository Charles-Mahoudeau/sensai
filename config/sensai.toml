[ollama]
url = "http://localhost:11434"
# how long the model stays loaded after a request: "30m", "2h", or seconds
keep_alive = "30m"

[profile]
path = "config/profile.toml"

[personas]
path = "config/personas"
default = "sensei"

[structured_output]
enabled = false

[agent]
# none | low | medium | high | ultra
thinking_effort = "medium"
