[ollama]
url = "http://localhost:11434"
# how long the model stays loaded after a request: "30m", "2h", or seconds
keep_alive = "30m"

[profile]
path = "config/profile.toml"

[personas]
path = "config/personas"
default = "sensai"

[structured_output]
enabled = false

[agent]
# none | low | medium | high | ultra
thinking_effort = "medium"

[sandbox]
# docker build -t sensai-sandbox src/sensai/adapters/sandbox/image
enabled = true
image = "sensai-sandbox"
timeout = 30                # seconds
memory = "512m"
cpus = 1
artifacts_dir = "artifacts"

# Each [mcp.servers.<name>] table declares one HTTP MCP server. The name is the tool
# namespace prefix (<name>__<tool>). Secrets stay in the environment: token_env names
# the variable holding the bearer token.

[mcp.servers.github]
url = "https://api.githubcopilot.com/mcp/"
token_env = "GITHUB_TOKEN"

# Local fake server for manual testing: uv run python scripts/fake_mcp_server.py
[mcp.servers.fake]
url = "http://127.0.0.1:8765/mcp/"
